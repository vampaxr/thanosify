<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID — Contact</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      height: 115px;
      border-bottom: 2px solid #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-box {
      width: 65px;
      height: 65px;
      border: 3px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .nav-links {
      display: flex;
      gap: 38px;
    }

    .nav-links a {
      color: #888;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
    }

    .nav-links a:hover {
      color: #111;
    }

    .commission {
      border: 2px solid #111;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 5px 5px 0 #111;
    }

    .open {
      color: #159447;
    }

    .contact {
      min-height: calc(100vh - 115px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 60px 20px;
    }

    .label {
      color: #888;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(70px, 12vw, 150px);
      letter-spacing: -9px;
      line-height: .85;
      margin-bottom: 40px;
    }

    .contact p {
      max-width: 650px;
      color: #666;
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .button {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 18px 30px;
      font-weight: 900;
      box-shadow: 6px 6px 0 #999;
    }

    .button:hover {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 #999;
    }

    .button.discord {
      background: white;
      color: #111;
      border: 2px solid #111;
    }

    @media (max-width: 800px) {
      nav {
        height: auto;
        padding: 20px;
        flex-wrap: wrap;
        gap: 20px;
      }

      .nav-links {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 20px;
      }

      .nav-links a {
        font-size: 18px;
      }

      .commission {
        font-size: 12px;
      }

      h1 {
        letter-spacing: -5px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <div class="brand">
      <div class="brand-box">V</div>
      <div class="brand-name">VOID</div>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </div>

    <div class="commission">
      Commissions: <span class="open">Open!</span>
    </div>

  </nav>

  <main class="contact">

    <div class="label">03 / CONTACT</div>

    <h1>LET'S TALK.</h1>

    <p>
      Need a website, Minecraft plugin, or something
      completely different? Get in touch with me.
    </p>

    <div class="buttons">

      <a
        class="button"
        href="mailto:YOUR_EMAIL_HERE"
      >
        EMAIL ME →
      </a>

      <a
        class="button discord"
        href="YOUR_DISCORD_LINK_HERE"
        target="_blank"
      >
        DISCORD →
      </a>

    </div>

  </main>

</body>
</html>
