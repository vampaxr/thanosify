<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID — Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      height: 115px;
      border-bottom: 2px solid #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-box {
      width: 65px;
      height: 65px;
      border: 3px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .nav-links {
      display: flex;
      gap: 38px;
    }

    .nav-links a {
      color: #888;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
    }

    .nav-links a:hover {
      color: #111;
    }

    .commission {
      border: 2px solid #111;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 5px 5px 0 #111;
    }

    .open {
      color: #159447;
    }

    .hero {
      min-height: calc(100vh - 115px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 {
      font-size: clamp(100px, 17vw, 210px);
      font-weight: 1000;
      letter-spacing: -14px;
      line-height: .8;
      margin-bottom: 60px;
    }

    .hero p {
      max-width: 850px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.4;
    }

    .hero .sub {
      margin-top: 25px;
      color: #777;
      font-size: 17px;
    }

    .arrow {
      margin-top: 35px;
      font-size: 30px;
      color: #777;
    }

    @media (max-width: 800px) {
      nav {
        height: auto;
        padding: 20px;
        flex-wrap: wrap;
        gap: 20px;
      }

      .nav-links {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 20px;
      }

      .nav-links a {
        font-size: 18px;
      }

      .commission {
        font-size: 12px;
      }

      .hero h1 {
        letter-spacing: -7px;
      }

      .hero p {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <div class="brand">
      <div class="brand-box">V</div>
      <div class="brand-name">VOID</div>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </div>

    <div class="commission">
      Commissions: <span class="open">Open!</span>
    </div>

  </nav>

  <main class="hero">

    <h1>VOID</h1>

    <p>
      Developer, creator, and builder of
      websites, Minecraft plugins, and other things.
    </p>

    <p class="sub">
      Take a look around.
    </p>

    <div class="arrow">↓</div>

  </main>

</body>
</html>
