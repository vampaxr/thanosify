<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lol</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .card {
      padding: 40px;
      max-width: 700px;
      animation: appear .5s ease;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 5rem);
      margin: 0;
      line-height: 1;
    }

    .red {
      color: #ff3b3b;
    }

    p {
      color: #aaa;
      font-size: 1.2rem;
      margin-top: 20px;
    }

    button {
      margin-top: 20px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      YOU AIN'T<br>
      GETTING IT.
    </h1>

    <p>after all of your disrespect?</p>
    <h1 class="red">DUMBASS 💀</h1>

    <button onclick="deny()">Try anyway</button>
  </div>

  <script>
    function deny() {
      document.querySelector("button").textContent = "LMFAOOO NO 😭";
      document.body.style.transform =
        `translate(${Math.random() * 10 - 5}px, ${Math.random() * 10 - 5}px)`;

      setTimeout(() => {
        document.body.style.transform = "none";
      }, 100);
    }
  </script>
</body>
</html>
